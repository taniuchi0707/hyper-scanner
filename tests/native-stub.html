<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android アプリの代役</title>
<style>
  html, body { height: 100%; margin: 0; }
  iframe { width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<!-- Android アプリ（MainActivity.java の Bridge）の代わりに、呼ばれた内容を __nativeLog に記録する -->
<iframe id="app" title="Hyper Scanner"></iframe>
<script>
  const stub = `<base href="${location.origin}/">
<script>
  window.__nativeLog = [];
  window.__nativeBytes = 0;
  window.HyperScannerNative = {
    isApp: () => true,
    beginFile: () => { __nativeLog.push('begin'); __nativeBytes = 0; return true; },
    appendChunk: (b64) => { __nativeBytes += atob(b64).length; return true; },
    finishFile: (name, action) => { __nativeLog.push('finish:' + name + ':' + action + ':' + __nativeBytes); return action === 'share' ? 'shared' : 'saved'; },
    openSaved: () => __nativeLog.push('open'),
    takeShared: () => '[]',
    setBars: (color, light) => __nativeLog.push('bars:' + color + ':' + light),
  };
<\/script>`;
  fetch('../index.html').then((r) => r.text()).then((html) => {
    document.getElementById('app').srcdoc = html.replace('<head>', '<head>' + stub);
  });
</script>
</body>
</html>
